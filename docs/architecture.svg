<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" width="1400" height="960" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">AFTERMATH system architecture</title>
  <desc id="d">Phones and the projector connect over WebSockets and HTTPS to a Bun game server, which calls Terse Durable Actors (one Planet actor per world plus one Universe actor), the Agent Relay network (Relaycast) and OpenAI models.</desc>
  <defs>
    <radialGradient id="bg" cx="70%" cy="20%" r="90%">
      <stop offset="0" stop-color="#1a1236"/>
      <stop offset="0.55" stop-color="#0a0818"/>
      <stop offset="1" stop-color="#040309"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171331"/>
      <stop offset="1" stop-color="#0e0b20"/>
    </linearGradient>
    <linearGradient id="cardHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1840"/>
      <stop offset="1" stop-color="#120e28"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="aW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9d2ff"/></marker>
    <marker id="aC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ee6ff"/></marker>
    <marker id="aV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b388ff"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffc65a"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7dff7a"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff8af0"/></marker>
    <pattern id="stars" width="140" height="140" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="20" r="1" fill="#ffffff" opacity=".35"/>
      <circle cx="80" cy="44" r=".8" fill="#ffffff" opacity=".25"/>
      <circle cx="120" cy="110" r="1.1" fill="#cfc6ff" opacity=".3"/>
      <circle cx="40" cy="96" r=".7" fill="#ffffff" opacity=".2"/>
      <circle cx="100" cy="8" r=".6" fill="#ffffff" opacity=".3"/>
    </pattern>
    <style>
      .h  { font-weight: 800; letter-spacing: .12em; }
      .m  { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace; }
      .t1 { fill: #f3efff; }
      .t2 { fill: #b7aedb; }
      .t3 { fill: #8a80b4; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1400" height="960" fill="url(#bg)"/>
  <rect width="1400" height="960" fill="url(#stars)"/>

  <!-- title -->
  <text x="30" y="58" class="h t1" font-size="34">AFTERMATH</text>
  <text x="292" y="58" class="t2" font-size="20">· system architecture</text>
  <text x="30" y="90" class="t3" font-size="16">Every world is a Durable Actor. Every AI is an Agent Relay agent. Humans are just visitors.</text>
  <!-- legend -->
  <g transform="translate(1030 44)">
    <rect x="0" y="0" width="340" height="56" rx="12" fill="#0d0a1e" stroke="#2c2552"/>
    <line x1="18" y1="20" x2="62" y2="20" stroke="#d9d2ff" stroke-width="2.5" marker-end="url(#aW)"/>
    <text x="74" y="25" class="t2" font-size="14">request / push</text>
    <line x1="18" y1="40" x2="62" y2="40" stroke="#ffc65a" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#aA)"/>
    <text x="74" y="45" class="t2" font-size="14">actor-initiated (alarm wakes the AI)</text>
  </g>

  <!-- ================= CLIENTS ================= -->
  <text x="30" y="150" class="h" font-size="15" fill="#5ee6ff">THE ROOM</text>

  <!-- phones -->
  <g>
    <rect x="30" y="170" width="270" height="215" rx="16" fill="url(#card)" stroke="#5ee6ff" stroke-opacity=".7" stroke-width="1.5"/>
    <rect x="50" y="192" width="30" height="50" rx="6" fill="none" stroke="#5ee6ff" stroke-width="2"/>
    <circle cx="65" cy="235" r="2.4" fill="#5ee6ff"/>
    <text x="94" y="214" class="h t1" font-size="20">PHONES</text>
    <text x="94" y="238" class="m" font-size="15" fill="#5ee6ff">/p</text>
    <text x="50" y="276" class="t2" font-size="16">• scan QR · hold to teleport</text>
    <text x="50" y="302" class="t2" font-size="16">• talk to your world's AI</text>
    <text x="50" y="328" class="t2" font-size="16">• intercepted transmissions</text>
    <text x="50" y="354" class="t2" font-size="16">• Mars colony · vote on gate</text>
  </g>

  <!-- projector -->
  <g>
    <rect x="30" y="405" width="270" height="225" rx="16" fill="url(#card)" stroke="#5ee6ff" stroke-opacity=".7" stroke-width="1.5"/>
    <rect x="48" y="428" width="38" height="26" rx="4" fill="none" stroke="#5ee6ff" stroke-width="2"/>
    <line x1="67" y1="454" x2="67" y2="464" stroke="#5ee6ff" stroke-width="2"/>
    <line x1="56" y1="465" x2="78" y2="465" stroke="#5ee6ff" stroke-width="2"/>
    <text x="100" y="448" class="h t1" font-size="20">PROJECTOR</text>
    <text x="100" y="472" class="m" font-size="15" fill="#5ee6ff">/stage</text>
    <text x="50" y="506" class="t2" font-size="16">• galaxy map · AI portraits</text>
    <text x="50" y="532" class="t2" font-size="16">• live Agent Relay feed</text>
    <text x="50" y="558" class="t2" font-size="16">• arrival cards · spotlight</text>
    <text x="50" y="584" class="t2" font-size="16">• actor memory inspector</text>
    <text x="50" y="610" class="t2" font-size="16">• vote tug-of-war · finale</text>
  </g>
  <text x="30" y="660" class="t3" font-size="14">public URL: Cloudflare quick tunnel to :3000</text>

  <!-- clients -> server arrows -->
  <line x1="304" y1="252" x2="416" y2="252" stroke="#5ee6ff" stroke-width="2.5" marker-start="url(#aC)" marker-end="url(#aC)"/>
  <text x="360" y="240" text-anchor="middle" class="h" font-size="12" fill="#5ee6ff">WEBSOCKET</text>
  <text x="360" y="272" text-anchor="middle" class="m t2" font-size="12">/ws/planet/:id</text>

  <line x1="304" y1="320" x2="416" y2="320" stroke="#d9d2ff" stroke-width="2.5" marker-end="url(#aW)"/>
  <text x="360" y="308" text-anchor="middle" class="h" font-size="12" fill="#d9d2ff">HTTPS</text>
  <text x="360" y="340" text-anchor="middle" class="m t2" font-size="12">/api/teleport…</text>

  <line x1="304" y1="500" x2="416" y2="500" stroke="#5ee6ff" stroke-width="2.5" marker-start="url(#aC)" marker-end="url(#aC)"/>
  <text x="360" y="488" text-anchor="middle" class="h" font-size="12" fill="#5ee6ff">WEBSOCKET</text>
  <text x="360" y="520" text-anchor="middle" class="m t2" font-size="12">/ws/stage</text>

  <line x1="304" y1="568" x2="416" y2="568" stroke="#d9d2ff" stroke-width="2.5" marker-end="url(#aW)"/>
  <text x="360" y="556" text-anchor="middle" class="h" font-size="12" fill="#d9d2ff">HTTPS</text>
  <text x="360" y="588" text-anchor="middle" class="m t2" font-size="12">/api/admin/*</text>

  <!-- ================= SERVER ================= -->
  <rect x="420" y="120" width="380" height="510" rx="18" fill="url(#cardHi)" stroke="#ffc65a" stroke-width="2" filter="url(#glow)" stroke-opacity=".9"/>
  <text x="442" y="156" class="h" font-size="20" fill="#ffc65a">BUN GAME SERVER</text>
  <text x="778" y="156" text-anchor="end" class="m t3" font-size="14">:3000</text>
  <text x="442" y="180" class="m t3" font-size="13">server/index.ts · server/lore.ts</text>

  <g font-size="16">
    <rect x="438" y="196" width="344" height="52" rx="10" fill="#0c0a1c" stroke="#3a3168"/>
    <circle cx="456" cy="214" r="5" fill="#ffc65a"/>
    <text x="470" y="219" class="t1" font-weight="700">REST + WebSocket gateway</text>
    <text x="470" y="239" class="m t3" font-size="13">/api/teleport · say · vote · export</text>

    <rect x="438" y="256" width="344" height="52" rx="10" fill="#0c0a1c" stroke="#3a3168"/>
    <circle cx="456" cy="274" r="5" fill="#ff8af0"/>
    <text x="470" y="279" class="t1" font-weight="700">World builder</text>
    <text x="470" y="299" class="m t3" font-size="13">lore seeds → gpt-6.1-terra JSON</text>

    <rect x="438" y="316" width="344" height="52" rx="10" fill="#0c0a1c" stroke="#3a3168"/>
    <circle cx="456" cy="334" r="5" fill="#ff8af0"/>
    <text x="470" y="339" class="t1" font-weight="700">AI brains</text>
    <text x="470" y="359" class="m t3" font-size="13">reply · initiate · answer · muse</text>

    <rect x="438" y="376" width="344" height="52" rx="10" fill="#0c0a1c" stroke="#3a3168"/>
    <circle cx="456" cy="394" r="5" fill="#ff9a52"/>
    <text x="470" y="399" class="t1" font-weight="700">Mars colony · HAVEN</text>
    <text x="470" y="419" class="m t3" font-size="13">O2 · power · water · food · sol</text>

    <rect x="438" y="436" width="344" height="52" rx="10" fill="#0c0a1c" stroke="#3a3168"/>
    <circle cx="456" cy="454" r="5" fill="#7dff7a"/>
    <text x="470" y="459" class="t1" font-weight="700">Auto-director</text>
    <text x="470" y="479" class="m t3" font-size="13">bots · event ~2.5 min · vote ~5 min</text>

    <rect x="438" y="496" width="344" height="52" rx="10" fill="#0c0a1c" stroke="#3a3168"/>
    <circle cx="456" cy="514" r="5" fill="#ff3b3b"/>
    <text x="470" y="519" class="t1" font-weight="700">Vote ledger</text>
    <text x="470" y="539" class="m t3" font-size="13">persuasion report by archetype</text>

    <rect x="438" y="556" width="344" height="52" rx="10" fill="#0c0a1c" stroke="#3a3168"/>
    <circle cx="456" cy="574" r="5" fill="#b388ff"/>
    <text x="470" y="579" class="t1" font-weight="700">Actor socket proxy</text>
    <text x="470" y="599" class="m t3" font-size="13">prepareWebsocket → pipe frames</text>
  </g>

  <!-- server <-> actors arrows -->
  <line x1="804" y1="262" x2="916" y2="262" stroke="#b388ff" stroke-width="2.5" marker-end="url(#aV)"/>
  <text x="860" y="250" text-anchor="middle" class="h" font-size="12" fill="#b388ff">RPC</text>
  <text x="860" y="282" text-anchor="middle" class="m t2" font-size="12">world · lines</text>

  <line x1="804" y1="330" x2="916" y2="330" stroke="#5ee6ff" stroke-width="2.5" marker-start="url(#aC)" marker-end="url(#aC)"/>
  <text x="860" y="318" text-anchor="middle" class="h" font-size="12" fill="#5ee6ff">WS PIPE</text>
  <text x="860" y="350" text-anchor="middle" class="m t2" font-size="12">visitor sockets</text>

  <line x1="916" y1="398" x2="804" y2="398" stroke="#ffc65a" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#aA)"/>
  <text x="860" y="386" text-anchor="middle" class="h" font-size="12" fill="#ffc65a">ALARM 25 s</text>
  <text x="860" y="418" text-anchor="middle" class="m t2" font-size="12">POST /api/tick</text>

  <line x1="804" y1="520" x2="916" y2="520" stroke="#b388ff" stroke-width="2.5" marker-start="url(#aV)" marker-end="url(#aV)"/>
  <text x="860" y="508" text-anchor="middle" class="h" font-size="12" fill="#b388ff">RPC + WS</text>
  <text x="860" y="540" text-anchor="middle" class="m t2" font-size="12">castVote · feed</text>

  <!-- ================= ACTORS ================= -->
  <rect x="920" y="120" width="450" height="510" rx="18" fill="url(#cardHi)" stroke="#b388ff" stroke-width="2" filter="url(#glow)" stroke-opacity=".9"/>
  <text x="942" y="156" class="h" font-size="20" fill="#b388ff">TERSE DURABLE ACTORS</text>
  <text x="1348" y="156" text-anchor="end" class="m t3" font-size="14">:7100</text>
  <text x="942" y="180" class="m t3" font-size="13">actors/src/actors.ts · terse actor dev | terse deploy</text>

  <!-- planet stack -->
  <rect x="954" y="202" width="402" height="214" rx="14" fill="#0b0919" stroke="#b388ff" stroke-opacity=".25"/>
  <rect x="946" y="198" width="402" height="214" rx="14" fill="#0d0b1e" stroke="#b388ff" stroke-opacity=".4"/>
  <rect x="938" y="194" width="402" height="214" rx="14" fill="#100d24" stroke="#b388ff" stroke-opacity=".85" stroke-width="1.5"/>
  <circle cx="964" cy="222" r="11" fill="#2a1d55" stroke="#b388ff" stroke-width="2"/>
  <circle cx="960" cy="218" r="3.5" fill="#e6dcff"/>
  <text x="984" y="229" class="t1" font-weight="800" font-size="21">Planet</text>
  <text x="1324" y="229" text-anchor="end" class="m" font-size="13" fill="#b388ff">× one per world + Mars</text>
  <g class="m t2" font-size="14">
    <text x="958" y="262">@Persisted world · cycles · serverUrl</text>
    <text x="958" y="290">SQLite memories: every line,</text>
    <text x="958" y="308">  intercept and visitor</text>
    <text x="958" y="336"><tspan fill="#ffc65a">alarm</tspan> every 25 s, even when dormant</text>
    <text x="958" y="364">broadcast() → visitor phones</text>
    <text x="958" y="392">inspect() → stage memory panel</text>
  </g>

  <!-- universe -->
  <rect x="938" y="432" width="414" height="180" rx="14" fill="#100d24" stroke="#ffd36e" stroke-opacity=".8" stroke-width="1.5"/>
  <circle cx="964" cy="460" r="11" fill="none" stroke="#ffd36e" stroke-width="2"/>
  <ellipse cx="964" cy="460" rx="18" ry="5" fill="none" stroke="#ffd36e" stroke-width="1.5" transform="rotate(-20 964 460)"/>
  <text x="992" y="467" class="t1" font-weight="800" font-size="21">Universe</text>
  <text x="1334" y="467" text-anchor="end" class="m" font-size="13" fill="#ffd36e">× 1</text>
  <g class="m t2" font-size="14">
    <text x="958" y="500">planets · links · feed (registry)</text>
    <text x="958" y="528">castVote(): one request at a time,</text>
    <text x="958" y="546">  each device counted exactly once</text>
    <text x="958" y="574">outcome · snapshot → /stage socket</text>
    <text x="958" y="598" fill="#8a80b4">restart the server: universe resumes</text>
  </g>

  <!-- server -> bottom arrows -->
  <line x1="520" y1="634" x2="520" y2="694" stroke="#7dff7a" stroke-width="2.5" marker-start="url(#aG)" marker-end="url(#aG)"/>
  <text x="532" y="668" class="m" font-size="13" fill="#7dff7a">send · dm · join</text>
  <line x1="760" y1="634" x2="760" y2="694" stroke="#ff8af0" stroke-width="2.5" marker-end="url(#aP)"/>
  <text x="772" y="668" class="m" font-size="13" fill="#ff8af0">chat · speech · moderations</text>

  <!-- ================= AGENT RELAY ================= -->
  <rect x="30" y="698" width="660" height="232" rx="18" fill="url(#cardHi)" stroke="#7dff7a" stroke-width="2" stroke-opacity=".85"/>
  <text x="52" y="734" class="h" font-size="20" fill="#7dff7a">AGENT RELAY</text>
  <text x="668" y="734" text-anchor="end" class="m t3" font-size="14">:8787</text>
  <text x="52" y="758" class="m t3" font-size="13">self-hosted Relaycast engine · @relaycast/sdk · every AI = a registered agent</text>

  <g>
    <rect x="52" y="776" width="196" height="96" rx="12" fill="#0b1410" stroke="#7dff7a" stroke-opacity=".6"/>
    <text x="70" y="806" class="m" font-weight="700" font-size="18" fill="#7dff7a">#wormhole</text>
    <text x="70" y="832" class="t2" font-size="15">first-contact</text>
    <text x="70" y="852" class="t2" font-size="15">broadcasts</text>

    <rect x="262" y="776" width="196" height="96" rx="12" fill="#0b1410" stroke="#7dff7a" stroke-opacity=".6"/>
    <text x="280" y="806" class="m" font-weight="700" font-size="18" fill="#7dff7a">DM</text>
    <text x="280" y="832" class="t2" font-size="15">alliances · threats</text>
    <text x="280" y="852" class="t2" font-size="15">gossip about humans</text>

    <rect x="472" y="776" width="196" height="96" rx="12" fill="#0b1410" stroke="#7dff7a" stroke-opacity=".6"/>
    <text x="490" y="806" class="m" font-weight="700" font-size="18" fill="#7dff7a">#council</text>
    <text x="490" y="832" class="t2" font-size="15">debate while the</text>
    <text x="490" y="852" class="t2" font-size="15">room votes</text>
  </g>
  <text x="52" y="904" class="t3" font-size="14">DMs are answered on the recipient's next wake cycle; humans see them as intercepts.</text>

  <!-- ================= OPENAI ================= -->
  <rect x="720" y="698" width="650" height="232" rx="18" fill="url(#cardHi)" stroke="#ff8af0" stroke-width="2" stroke-opacity=".85"/>
  <text x="742" y="734" class="h" font-size="20" fill="#ff8af0">OPENAI</text>
  <text x="1348" y="734" text-anchor="end" class="m t3" font-size="14">routed by job</text>
  <text x="742" y="758" class="m t3" font-size="13">JSON-mode chat · speech · images · moderation</text>
  <g font-size="15">
    <text x="742" y="788" class="m" font-weight="700" fill="#f3efff">gpt-6.1-terra</text>
    <text x="982" y="788" class="t2">worlds (3-6 s) + conversations (~2 s)</text>
    <text x="742" y="811" class="m" font-weight="700" fill="#f3efff">gpt-6-luna</text>
    <text x="982" y="811" class="t2">AI-to-AI chatter on the network</text>
    <text x="742" y="834" class="m" font-weight="700" fill="#f3efff">gpt-6-astra</text>
    <text x="982" y="834" class="t2">finale + Mars emergencies (background)</text>
    <text x="742" y="857" class="m" font-weight="700" fill="#f3efff">gpt-4o-mini-tts</text>
    <text x="982" y="857" class="t2">a voice per archetype, on phones</text>
    <text x="742" y="880" class="m" font-weight="700" fill="#f3efff">gpt-image-2</text>
    <text x="982" y="880" class="t2">every portrait, landscape and ghost</text>
    <text x="742" y="903" class="m" font-weight="700" fill="#f3efff">omni-moderation</text>
    <text x="982" y="903" class="t2">every name and player message</text>
  </g>
</svg>
