<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wormhole demo</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #cfd8ff; font: 12px/1.4 ui-monospace, Menlo, monospace; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #000; }
  #ui { position: fixed; left: 8px; right: 8px; bottom: max(10px, env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; gap: 6px; z-index: 2; }
  button { font: inherit; color: #e8f0ff; background: rgba(20, 24, 48, .72); border: 1px solid rgba(160, 180, 255, .35); border-radius: 8px; padding: 8px 10px; }
  #log { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 8px; right: 8px; z-index: 2; opacity: .8; white-space: pre-wrap; pointer-events: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="log"></div>
<div id="ui">
  <button id="bStart">start</button>
  <button id="bDest">setDestination(ice)</button>
  <button id="bArrive">arrive</button>
  <button id="bStop">stop</button>
</div>
<script src="/wormhole.js"></script>
<script>
(function () {
  'use strict';
  var cv = document.getElementById('cv');
  var logEl = document.getElementById('log');
  var q = new URLSearchParams(location.search);
  var t0 = 0;
  function log(m) {
    var line = (t0 ? ((performance.now() - t0) / 1000).toFixed(2) + 's ' : '') + m;
    logEl.textContent = (line + '\n' + logEl.textContent).split('\n').slice(0, 6).join('\n');
    console.log('[demo] ' + line);
  }
  document.getElementById('bStart').onclick = function () {
    t0 = performance.now();
    var ok = Wormhole.supported() && Wormhole.start(cv, { dest: q.get('dest') || undefined, sky: q.get('sky') || undefined, tint: q.get('tint') || '#7f8cff' });
    log('start -> ' + ok + (ok ? '' : ' (caller would fall back to the video warp)'));
  };
  document.getElementById('bDest').onclick = function () {
    Wormhole.setDestination(q.get('dest2') || '/assets/world-ice.webp');
    log('setDestination(world-ice)');
  };
  document.getElementById('bArrive').onclick = function () {
    var a = performance.now();
    log('arrive()');
    Wormhole.arrive().then(function () { log('arrive resolved after ' + Math.round(performance.now() - a) + 'ms'); });
  };
  document.getElementById('bStop').onclick = function () { Wormhole.stop(); log('stop'); };
  log('supported: ' + Wormhole.supported());
  if (q.has('auto')) document.getElementById('bStart').click();
})();
</script>
</body>
</html>
